<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; border-radius: 10px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        h1 { color: #667eea; margin-bottom: 20px; text-align: center; }
        h2 { color: #333; margin-top: 30px; margin-bottom: 15px; border-bottom: 2px solid #667eea; padding-bottom: 5px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #f8f9fa; padding: 20px; border-radius: 8px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .stat-card h3 { color: #666; font-size: 16px; margin-bottom: 10px; }
        .stat-card .value { font-size: 28px; font-weight: bold; color: #667eea; }
        ul { list-style-type: none; }
        li { padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
        .text-danger { color: #dc3545; font-weight: bold; }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; text-decoration: none; display: inline-block; background-color: #6c757d; color: white; margin-top: 20px; }
        .btn:hover { background-color: #5a6268; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Statistics Dashboard</h1>
        
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Products</h3>
                <div class="value" th:text="${totalProducts}">0</div>
            </div>
            <div class="stat-card">
                <h3>Total Inventory Value</h3>
                <div class="value" th:text="'$' + ${totalValue != null ? #numbers.formatDecimal(totalValue, 1, 2) : '0.00'}">$0.00</div>
            </div>
            <div class="stat-card">
                <h3>Average Price</h3>
                <div class="value" th:text="'$' + ${averagePrice != null ? #numbers.formatDecimal(averagePrice, 1, 2) : '0.00'}">$0.00</div>
            </div>
        </div>
        
        <h2>⚠️ Low Stock Alerts (Quantity < 10)</h2>
        <div th:if="${lowStock != null and !lowStock.isEmpty()}">
            <ul>
                <li th:each="p : ${lowStock}">
                    <span th:text="${p.name} + ' (' + ${p.productCode} + ')'"></span>
                    <span class="text-danger" th:text="'Qty: ' + ${p.quantity}"></span>
                </li>
            </ul>
        </div>
        <div th:if="${lowStock == null or lowStock.isEmpty()}">
            <p>All products have sufficient stock levels.</p>
        </div>
        
        <div style="text-align: center;">
            <a th:href="@{/products}" class="btn">⬅️ Back to Products</a>
        </div>
    </div>
</body>
</html>
