<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Search and explore GitHub repositories by keyword, sort by stars, forks, or recent updates.">
    <title>GitHub Repo Finder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* ── Header ─────────────────────────────────── */
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-top: 20px;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #58a6ff, #3fb950);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .header p {
            color: #8b949e;
            font-size: 1rem;
        }

        /* ── Search Container ───────────────────────── */
        .search-container {
            background: #161b22;
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid #30363d;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .search-box input {
            flex: 1;
            padding: 14px 16px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #c9d1d9;
            font-size: 16px;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
        }

        .search-box button {
            padding: 14px 32px;
            background: linear-gradient(135deg, #238636, #2ea043);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            transition: transform 0.15s, box-shadow 0.2s;
        }

        .search-box button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(46, 160, 67, 0.35);
        }

        .search-box button:active {
            transform: translateY(0);
        }

        .filters {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .filters label {
            color: #8b949e;
            font-size: 14px;
        }

        .filters select {
            padding: 8px 14px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #c9d1d9;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .filters select:focus {
            outline: none;
            border-color: #58a6ff;
        }

        /* ── Result Stats ───────────────────────────── */
        .result-stats {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 16px;
            padding-left: 4px;
        }

        .result-stats strong {
            color: #c9d1d9;
        }

        /* ── Repo Card ──────────────────────────────── */
        .repo-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 22px 24px;
            margin-bottom: 14px;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            animation: fadeSlideIn 0.35s ease forwards;
            opacity: 0;
        }

        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .repo-card:hover {
            transform: translateY(-3px);
            border-color: #58a6ff;
            box-shadow: 0 6px 20px rgba(88, 166, 255, 0.08);
        }

        .repo-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .owner-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 1px solid #30363d;
        }

        .repo-owner {
            color: #8b949e;
            font-size: 14px;
        }

        .repo-name {
            color: #58a6ff;
            font-size: 20px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: color 0.15s;
        }

        .repo-name:hover {
            text-decoration: underline;
            color: #79c0ff;
        }

        .repo-description {
            color: #8b949e;
            margin: 10px 0 14px;
            line-height: 1.5;
            font-size: 14px;
        }

        .repo-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            font-size: 13px;
            color: #8b949e;
            align-items: center;
        }

        .repo-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .language-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }

        .language-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 10px;
            background: rgba(31, 111, 235, 0.15);
            border-radius: 12px;
            font-size: 12px;
            color: #79c0ff;
        }

        /* ── Loading ────────────────────────────────── */
        .loading {
            text-align: center;
            padding: 50px 20px;
            color: #8b949e;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #30363d;
            border-top-color: #58a6ff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ── Error ──────────────────────────────────── */
        .error {
            background: rgba(218, 54, 51, 0.12);
            border: 1px solid #f85149;
            color: #f85149;
            padding: 14px 18px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: fadeSlideIn 0.3s ease forwards;
        }

        /* ── Load More ──────────────────────────────── */
        .load-more {
            text-align: center;
            margin: 30px 0 40px;
        }

        .load-more button {
            padding: 14px 48px;
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            font-family: inherit;
            transition: background 0.2s, border-color 0.2s, transform 0.15s;
        }

        .load-more button:hover {
            background: #30363d;
            border-color: #484f58;
            transform: translateY(-1px);
        }

        /* ── Empty State ────────────────────────────── */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #484f58;
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .empty-state p {
            font-size: 16px;
            color: #8b949e;
        }

        /* ── Responsive ─────────────────────────────── */
        @media (max-width: 600px) {
            .search-box {
                flex-direction: column;
            }

            .repo-meta {
                gap: 12px;
            }

            .header h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 GitHub Repository Finder</h1>
            <p>Search and explore GitHub repositories</p>
        </div>

        <div class="search-container">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search repositories (e.g. react, python, machine learning)..."
                       onkeypress="if(event.key==='Enter') performSearch()">
                <button id="searchBtn" onclick="performSearch()">Search</button>
            </div>

            <div class="filters">
                <label for="sortSelect">Sort by:</label>
                <select id="sortSelect" onchange="performSearch()">
                    <option value="stars">⭐ Stars</option>
                    <option value="forks">🔱 Forks</option>
                    <option value="updated">🕒 Recently Updated</option>
                </select>
            </div>
        </div>

        <div id="errorMessage"></div>
        <div id="resultStats"></div>
        <div id="repoList"></div>
        <div id="loadMoreContainer"></div>
    </div>

    <script>
        // ── State ──────────────────────────────────────
        let currentPage = 1;
        let currentQuery = '';
        let totalResults = 0;

        // ── Language color map (subset of GitHub language colors) ──
        const languageColors = {
            'JavaScript':  '#f1e05a',
            'TypeScript':  '#3178c6',
            'Python':      '#3572A5',
            'Java':        '#b07219',
            'C++':         '#f34b7d',
            'C#':          '#178600',
            'C':           '#555555',
            'Go':          '#00ADD8',
            'Rust':        '#dea584',
            'Ruby':        '#701516',
            'PHP':         '#4F5D95',
            'Swift':       '#F05138',
            'Kotlin':      '#A97BFF',
            'Dart':        '#00B4AB',
            'HTML':        '#e34c26',
            'CSS':         '#563d7c',
            'Shell':       '#89e051',
            'Lua':         '#000080',
            'Scala':       '#c22d40',
            'R':           '#198CE7',
            'Vue':         '#41b883',
            'Jupyter Notebook': '#DA5B0B',
        };

        /**
         * Search GitHub repositories via the public API.
         * @param {string} query  - Search keyword(s)
         * @param {string} sort   - Sort field: stars | forks | updated
         * @param {number} page   - Page number (1-indexed)
         * @returns {Promise<Object>} GitHub API response { total_count, items[] }
         */
        async function searchRepositories(query, sort = 'stars', page = 1) {
            const url = `https://api.github.com/search/repositories?q=${encodeURIComponent(query)}&sort=${sort}&order=desc&page=${page}&per_page=10`;

            const response = await fetch(url, {
                headers: { 'Accept': 'application/vnd.github.v3+json' }
            });

            // Handle rate-limiting (403) and other errors
            if (response.status === 403) {
                throw new Error('API rate limit exceeded. GitHub allows 60 requests per hour for unauthenticated users. Please try again later.');
            }

            if (!response.ok) {
                throw new Error(`GitHub API error: ${response.status} ${response.statusText}`);
            }

            return await response.json();
        }

        /**
         * Render repository cards into the DOM.
         * @param {Array}   repos   - Array of repository objects from GitHub API
         * @param {boolean} append  - If true, append to existing list; otherwise replace
         */
        function displayRepositories(repos, append = false) {
            const repoList = document.getElementById('repoList');

            if (!append) {
                repoList.innerHTML = '';
            }

            if (repos.length === 0 && !append) {
                repoList.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <p>No repositories found. Try a different search term.</p>
                    </div>`;
                return;
            }

            appendRepositories(repos);
        }

        /**
         * Append repository cards to the existing list.
         * @param {Array} repos - Array of repository objects
         */
        function appendRepositories(repos) {
            const repoList = document.getElementById('repoList');

            repos.forEach((repo, index) => {
                const card = createRepoCard(repo);
                // Stagger the fade-in animation
                card.style.animationDelay = `${index * 0.06}s`;
                repoList.appendChild(card);
            });
        }

        /**
         * Create a DOM element for a single repository card.
         * @param {Object} repo - GitHub repository object
         * @returns {HTMLElement} The repo card element
         */
        function createRepoCard(repo) {
            const card = document.createElement('div');
            card.className = 'repo-card';

            const langColor = languageColors[repo.language] || '#8b949e';

            const languageHTML = repo.language
                ? `<span class="language-badge">
                       <span class="language-dot" style="background:${langColor}"></span>
                       ${repo.language}
                   </span>`
                : '';

            const descriptionHTML = repo.description
                ? `<p class="repo-description">${escapeHTML(repo.description)}</p>`
                : `<p class="repo-description" style="font-style:italic;">No description provided.</p>`;

            card.innerHTML = `
                <div class="repo-header">
                    <img class="owner-avatar" src="${repo.owner.avatar_url}" alt="${repo.owner.login}" loading="lazy">
                    <span class="repo-owner">${repo.owner.login} /</span>
                </div>
                <a class="repo-name" href="${repo.html_url}" target="_blank" rel="noopener noreferrer">${repo.name}</a>
                ${descriptionHTML}
                <div class="repo-meta">
                    ${languageHTML}
                    <span>⭐ ${formatNumber(repo.stargazers_count)}</span>
                    <span>🔱 ${formatNumber(repo.forks_count)}</span>
                    <span>👁️ ${formatNumber(repo.watchers_count)}</span>
                    <span>🐛 ${formatNumber(repo.open_issues_count)} issues</span>
                </div>
            `;

            return card;
        }

        /**
         * Get the currently selected sort value.
         * @returns {string} The sort field: stars | forks | updated
         */
        function getSortValue() {
            return document.getElementById('sortSelect').value;
        }

        /**
         * Perform a fresh search using the current input and sort selection.
         */
        async function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            currentQuery = query;
            currentPage = 1;

            clearError();
            showLoading();

            try {
                const data = await searchRepositories(query, getSortValue(), currentPage);
                totalResults = data.total_count;

                updateResultStats(totalResults);
                displayRepositories(data.items, false);
                updateLoadMoreButton();
            } catch (error) {
                showError(error.message);
                document.getElementById('repoList').innerHTML = '';
                document.getElementById('resultStats').innerHTML = '';
                document.getElementById('loadMoreContainer').innerHTML = '';
            }
        }

        /**
         * Load the next page of results and append them.
         */
        async function loadMore() {
            currentPage++;

            // Show a small spinner inside the button while loading
            const container = document.getElementById('loadMoreContainer');
            container.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading more repositories…</p>
                </div>`;

            try {
                const data = await searchRepositories(currentQuery, getSortValue(), currentPage);
                displayRepositories(data.items, true);
                updateLoadMoreButton();
            } catch (error) {
                showError(error.message);
                currentPage--; // Revert page increment on failure
                updateLoadMoreButton();
            }
        }

        // ── UI Helpers ─────────────────────────────────

        /**
         * Show an error message banner.
         * @param {string} message - Error text to display
         */
        function showError(message) {
            const el = document.getElementById('errorMessage');
            el.innerHTML = `<div class="error">⚠️ ${escapeHTML(message)}</div>`;
        }

        /**
         * Clear any displayed error message.
         */
        function clearError() {
            document.getElementById('errorMessage').innerHTML = '';
        }

        /**
         * Show a loading spinner in the repo list area.
         */
        function showLoading() {
            document.getElementById('repoList').innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Searching repositories…</p>
                </div>`;
            document.getElementById('loadMoreContainer').innerHTML = '';
            document.getElementById('resultStats').innerHTML = '';
        }

        /**
         * Update the result stats display.
         * @param {number} total - Total number of matching repositories
         */
        function updateResultStats(total) {
            document.getElementById('resultStats').innerHTML =
                `<div class="result-stats">Found <strong>${formatNumber(total)}</strong> repositories</div>`;
        }

        /**
         * Show or hide the "Load More" button based on remaining results.
         */
        function updateLoadMoreButton() {
            const container = document.getElementById('loadMoreContainer');
            const loaded = currentPage * 10;

            if (loaded < totalResults) {
                container.innerHTML = `
                    <div class="load-more">
                        <button onclick="loadMore()">Load More Results</button>
                    </div>`;
            } else {
                container.innerHTML = '';
            }
        }

        /**
         * Format large numbers with k/M suffixes.
         * @param {number} num - Number to format
         * @returns {string} Formatted string (e.g. 1.5k, 2.3M)
         */
        function formatNumber(num) {
            if (num >= 1_000_000) {
                return (num / 1_000_000).toFixed(1) + 'M';
            }
            if (num >= 1000) {
                return (num / 1000).toFixed(1) + 'k';
            }
            return num.toString();
        }

        /**
         * Escape HTML special characters to prevent XSS.
         * @param {string} str - Raw string
         * @returns {string} HTML-safe string
         */
        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
    </script>
</body>
</html>
