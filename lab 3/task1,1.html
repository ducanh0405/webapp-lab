<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Validator</title>
    <style>
        .form-container {
            max-width: 400px;
            margin: 50px auto;
            padding: 30px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        
        input.valid {
            border-color: #28a745;
        }
        
        input.invalid {
            border-color: #dc3545;
        }
        
        .error-message {
            color: #dc3545;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        
        button[type="submit"]:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Sign Up Form</h2>
        <form id="signupForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter username">
                <div class="error-message" id="usernameError"></div>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter email">
                <div class="error-message" id="emailError"></div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password">
                <div class="error-message" id="passwordError"></div>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm password">
                <div class="error-message" id="confirmPasswordError"></div>
            </div>
            <button type="submit" id="submitBtn" disabled>Sign Up</button>
        </form>
    </div>

    <script>
        // Validation functions

        function validateUsername(username) {
            if (username.length < 4 || username.length > 20) {
                return false;
            }
            if (!/^[a-zA-Z0-9]+$/.test(username)) {
                return false;
            }
            return true;
        }

        function validateEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        function validatePassword(password) {
            if (password.length < 8) {
                return false;
            }
            if (!/[A-Z]/.test(password)) {
                return false;
            }
            if (!/[0-9]/.test(password)) {
                return false;
            }
            return true;
        }

        function validatePasswordMatch(pass1, pass2) {
            if (pass1 !== pass2) {
                return false;
            }
            return true;
        }

        function showError(fieldId, message) {
            const errorElement = document.getElementById(fieldId);
            errorElement.textContent = message;
            errorElement.classList.add('show');
        }

        function clearError(fieldId) {
            const errorElement = document.getElementById(fieldId);
            errorElement.textContent = '';
            errorElement.classList.remove('show');
        }

        function validateForm() {
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            let isValid = true;

            // Validate username
            if (username === '') {
                clearError('usernameError');
                isValid = false;
            } else if (!validateUsername(username)) {
                showError('usernameError', 'Username must be 4-20 characters and alphanumeric only.');
                document.getElementById('username').classList.add('invalid');
                document.getElementById('username').classList.remove('valid');
                isValid = false;
            } else {
                clearError('usernameError');
                document.getElementById('username').classList.add('valid');
                document.getElementById('username').classList.remove('invalid');
            }

            // Validate email
            if (email === '') {
                clearError('emailError');
                isValid = false;
            } else if (!validateEmail(email)) {
                showError('emailError', 'Please enter a valid email address.');
                document.getElementById('email').classList.add('invalid');
                document.getElementById('email').classList.remove('valid');
                isValid = false;
            } else {
                clearError('emailError');
                document.getElementById('email').classList.add('valid');
                document.getElementById('email').classList.remove('invalid');
            }

            // Validate password
            if (password === '') {
                clearError('passwordError');
                isValid = false;
            } else if (!validatePassword(password)) {
                showError('passwordError', 'Password must be at least 8 characters, with an uppercase letter and a number.');
                document.getElementById('password').classList.add('invalid');
                document.getElementById('password').classList.remove('valid');
                isValid = false;
            } else {
                clearError('passwordError');
                document.getElementById('password').classList.add('valid');
                document.getElementById('password').classList.remove('invalid');
            }

            // Validate confirm password
            if (confirmPassword === '') {
                clearError('confirmPasswordError');
                isValid = false;
            } else if (!validatePasswordMatch(password, confirmPassword)) {
                showError('confirmPasswordError', 'Passwords do not match.');
                document.getElementById('confirmPassword').classList.add('invalid');
                document.getElementById('confirmPassword').classList.remove('valid');
                isValid = false;
            } else {
                clearError('confirmPasswordError');
                document.getElementById('confirmPassword').classList.add('valid');
                document.getElementById('confirmPassword').classList.remove('invalid');
            }

            // Enable/disable submit button
            document.getElementById('submitBtn').disabled = !isValid;

            return isValid;
        }

        // Event listeners for real-time validation
        document.getElementById('username').addEventListener('input', validateForm);
        document.getElementById('email').addEventListener('input', validateForm);
        document.getElementById('password').addEventListener('input', validateForm);
        document.getElementById('confirmPassword').addEventListener('input', validateForm);

        // Handle form submission
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            if (validateForm()) {
                alert('Sign up successful!');
                this.reset();
                document.getElementById('submitBtn').disabled = true;
                document.querySelectorAll('input').forEach(function(input) {
                    input.classList.remove('valid', 'invalid');
                });
            }
        });
    </script>
</body>
</html>
