# ==========================================
# APPLICATION CONFIGURATION
# ==========================================
spring.application.name=customer-api
server.port=8080

# ==========================================
# DATABASE CONFIGURATION (PRIMARY: MYSQL)
# ==========================================
# Update database URL, username, and password as needed for your local environment
spring.datasource.url=jdbc:mysql://localhost:3306/customer_management?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=your_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================
# JSON OUTPUT FORMATTING
# ==========================================
spring.jackson.serialization.indent_output=true
spring.jackson.serialization.write-dates-as-timestamps=false

# ==========================================
# LOGGING LEVEL
# ==========================================
logging.level.com.example.customerapi=DEBUG

# ==========================================
# STANDALONE FALLBACK (H2 IN-MEMORY)
# ==========================================
# UNCOMMENT below lines to run immediately without a local MySQL Server!
# spring.datasource.url=jdbc:h2:mem:customer_management;DB_CLOSE_DELAY=-1;MODE=MySQL
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
